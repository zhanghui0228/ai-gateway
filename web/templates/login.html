<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGateway · 登录</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/console.css">
</head>
<body>
<div class="scanline"></div>
<div class="login-wrap">
  <div class="login-box panel">
    <div class="login-logo">
      <img src="/static/img/logo.svg" class="logo-large" alt="AI Gateway">
      <div class="mark">AI GATEWAY</div>
      <div class="sub">本地模型中转控制台</div>
    </div>
    <!-- 登录表单 -->
    <div id="login-form">
      <div class="field">
        <input type="password" id="pwd" placeholder="管理员密码" autofocus autocomplete="current-password">
      </div>
      <button class="btn" id="btn-login">进入控制台</button>
      <div class="login-err" id="err"></div>
      <div class="dim" style="font-size:11px;text-align:center;margin-top:14px">默认密码 admin123,登录后请修改</div>
    </div>
    <!-- 强制修改密码表单(默认密码时显示) -->
    <div id="change-pwd-form" style="display:none">
      <div class="field">
        <input type="password" id="pwd-new" placeholder="新密码(至少6位)" autofocus autocomplete="new-password">
      </div>
      <div class="field">
        <input type="password" id="pwd-confirm" placeholder="确认新密码" autocomplete="new-password">
      </div>
      <button class="btn" id="btn-change-pwd">修改密码并登录</button>
      <div class="login-err" id="err-change"></div>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
let loginSession = false; // 标记是否已通过登录验证(需强制改密)

async function login() {
  const pwd = $('#pwd').value;
  if (!pwd) return;
  const r = await fetch('/admin/api/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pwd})
  });
  if (r.ok) {
    const data = await r.json();
    if (data.force_change_password) {
      // 强制修改密码
      loginSession = true;
      $('#login-form').style.display = 'none';
      $('#change-pwd-form').style.display = 'block';
      $('#pwd-new').focus();
    } else {
      location.href = '/';
    }
  } else {
    $('#err').textContent = '密码错误'; $('#pwd').select();
  }
}

async function changePassword() {
  const np = $('#pwd-new').value;
  const cp = $('#pwd-confirm').value;
  if (np.length < 6) { $('#err-change').textContent = '新密码至少6位'; return; }
  if (np !== cp) { $('#err-change').textContent = '两次输入不一致'; return; }
  const r = await fetch('/admin/api/password', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({old: $('#pwd').value, new: np})
  });
  if (r.ok) {
    location.href = '/';
  } else {
    const d = await r.json();
    $('#err-change').textContent = d.error || '修改失败';
  }
}

$('#btn-login').onclick = login;
$('#pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#btn-change-pwd').onclick = changePassword;
$('#pwd-confirm').addEventListener('keydown', e => { if (e.key === 'Enter') changePassword(); });
</script>
</body>
</html>
