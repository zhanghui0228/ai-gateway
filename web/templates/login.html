<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGateway · 登录</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/console.css">
</head>
<body>
<div class="scanline"></div>
<div class="login-wrap">
  <div class="login-box panel">
    <div class="login-logo">
      <img src="/static/img/logo.svg" class="logo-large" alt="AI Gateway">
      <div class="mark">AI GATEWAY</div>
      <div class="sub">本地模型中转控制台</div>
    </div>
    <div class="field">
      <input type="password" id="pwd" placeholder="管理员密码" autofocus autocomplete="current-password">
    </div>
    <button class="btn" id="btn-login">进入控制台</button>
    <div class="login-err" id="err"></div>
    <div class="dim" style="font-size:11px;text-align:center;margin-top:14px">默认密码 admin123,登录后请修改</div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
async function login() {
  const pwd = $('#pwd').value;
  if (!pwd) return;
  const r = await fetch('/admin/api/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pwd})
  });
  if (r.ok) { location.href = '/'; }
  else { $('#err').textContent = '密码错误'; $('#pwd').select(); }
}
$('#btn-login').onclick = login;
$('#pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
